name: Deploy to Dev Server

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  build-and-deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Copy files to server via SCP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dist/index.html"
          target: ${{ secrets.SERVER_PATH }}
          strip_components: 1

  verify-deployment:
    name: verify-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Verify deployed commit
        env:
          DEV_SERVER_URL: ${{ secrets.DEV_SERVER_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${DEV_SERVER_URL:-}" ]; then
            echo "Brak sekretu DEV_SERVER_URL." >&2
            exit 1
          fi

          expected="${EXPECTED_SHA:0:7}"
          url="${DEV_SERVER_URL%/}/"
          status="$(curl -sS --retry 5 --retry-delay 5 -o /tmp/flux-eod-index.html -w "%{http_code}" "$url")"

          if [ "$status" != "200" ]; then
            echo "Test po wdrożeniu nie przeszedł: $url zwrócił HTTP $status zamiast 200." >&2
            exit 1
          fi

          if ! grep -q "$expected" /tmp/flux-eod-index.html; then
            echo "Test po wdrożeniu nie przeszedł: $url nie pokazuje commita $expected." >&2
            exit 1
          fi

          echo "Test po wdrożeniu przeszedł: $url pokazuje commit $expected."
