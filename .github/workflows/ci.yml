name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "Sprawdzanie plików w repozytorium..."
          ls -la
          
          # Sprawdzamy, czy istnieje nasz plik startowy
          if [ -f index.html ]; then
            echo "✅ Znaleziono index.html - projekt wygląda dobrze."
          else
            echo "❌ Błąd: Brak pliku index.html!"
            exit 1
          fi
